<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

    <header class="topbar">
        <h2>Aura AI</h2>
        <span>Powered by Groq</span>
    </header>

    <main class="chat-area" id="chatBox">
        <div class="welcome">
            <h1>How can I help you today?</h1>
            <p>Ask anything, generate ideas, write code, or learn concepts.</p>
        </div>
    </main>

    <div class="input-wrapper">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Message Aura AI...">
            <button onclick="sendMessage()">➤</button>
        </div>
        <p class="note">Aura AI may make mistakes. Check important information.</p>
    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
