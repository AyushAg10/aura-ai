<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura AI Voice Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="logo">A</div>
            <h2>Aura AI</h2>
        </div>

        <button class="new-chat" onclick="newChat()">+ New Chat</button>

        <div class="history-title">Recent Chats</div>
        <div id="historyList" class="history-list"></div>
    </aside>

    <main class="main">
        <header class="topbar">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <h3>Aura AI Voice Assistant</h3>
            <span>Groq Llama</span>
        </header>

        <section class="chat-area" id="chatBox">
            <div class="welcome" id="welcome">
                <h1>How can I help you today?</h1>
                <p>Type or use your voice to ask anything.</p>
            </div>
        </section>

        <div class="prompt-wrapper">
            <div class="prompt-box">
                <button class="voice-btn" id="micBtn" onclick="startVoiceInput()">🎤</button>
                <textarea id="userInput" placeholder="Message Aura AI..." rows="1"></textarea>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
            <p id="voiceStatus">Click 🎤 to speak. Aura AI can also read answers aloud.</p>
        </div>
    </main>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
